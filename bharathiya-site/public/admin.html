<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · பதிவுகள்</title>
<meta name="theme-color" content="#5A140B">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@700&family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--maroon:#7A1F12;--maroon-d:#5A140B;--saffron:#D9640F;--gold:#F4B740;--cream:#FFF8EC;--cream-2:#FBEFD9;--ink:#2A1A12;--muted:#6B5444;--line:#EAD7B7;--navy:#172554;--green:#1FAF5A}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Hind Madurai',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit}
.hide{display:none !important}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--maroon-d),#2A0D07)}
.lcard{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.lcard img{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:block}
.lcard h1{font-family:'Noto Serif Tamil',serif;color:var(--maroon);font-size:21px;margin:0 0 4px}
.lcard p{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.lcard label{display:block;text-align:left;font-weight:600;font-size:14.5px;margin:12px 0 6px}
.in{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#FFFDF8;font-size:16px}
.in:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px rgba(217,100,15,.15)}
.pbtn{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:999px;background:var(--saffron);color:#fff;font-weight:700;font-size:16.5px;cursor:pointer}
.pbtn[disabled]{opacity:.6}
.err{color:#B42318;font-size:14px;margin-top:10px;min-height:20px}
/* app */
.top{position:sticky;top:0;z-index:20;background:var(--maroon-d);color:#FFF3DF;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px -12px rgba(0,0,0,.6)}
.top img{width:38px;height:38px;border-radius:50%;background:#fff}
.top b{font-family:'Noto Serif Tamil',serif;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(244,183,64,.5);background:transparent;color:#FFE7B8;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.main{max-width:960px;margin:0 auto;padding:14px 12px 80px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;line-height:1.25}
.tab.on{background:var(--maroon);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.stat.on{border-color:var(--saffron);box-shadow:0 0 0 2px rgba(217,100,15,.25)}
.stat .n{font-size:24px;font-weight:700;color:var(--maroon);line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .in{min-height:44px;flex:1}
.tools .ibtn{color:var(--maroon);border-color:var(--line);background:#fff;min-height:44px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 24px -22px rgba(122,31,18,.6)}
.card-h{display:flex;align-items:flex-start;gap:10px}
.card-h .who{flex:1;min-width:0}
.nm{font-weight:700;font-size:17px;line-height:1.35}
.meta{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.src{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.src.bcc{background:#FDE7C7;color:#9A3412}
.src.tamilgeethai{background:#DCE3F7;color:var(--navy)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.st-new{background:#FFF1C2;color:#8A5A00}
.st-contacted{background:#DBEAFE;color:#1E40AF}
.st-joined{background:#DCFCE7;color:#166534}
.st-not_interested{background:#F3F4F6;color:#4B5563}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
.act.wa{background:var(--green);color:#fff}
.act.call{background:var(--cream-2);color:var(--maroon)}
.act.more{background:transparent;color:var(--saffron);border:1px solid var(--line)}
.det{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.kv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,60%);gap:4px 10px;font-size:14px;line-height:1.6}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.fu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fu .full{grid-column:1/-1}
.fu label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.fu select,.fu input,.fu textarea{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFDF8;font-size:15px}
.fu textarea{min-height:70px;resize:vertical}
.save{min-height:44px;border:0;border-radius:999px;background:var(--maroon);color:#fff;font-weight:700;cursor:pointer}
.shot{display:inline-block;margin-top:10px;color:var(--navy);font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.more-btn{margin:14px auto 0;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2A1A12;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.due{color:#B42318;font-weight:700}
@media (min-width:700px){.main{padding:20px 20px 80px}.list{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<section class="login" id="loginView">
  <form class="lcard" id="loginForm">
    <img src="images/bcc-logo-160.webp" alt="">
    <h1>Admin உள்நுழைவு</h1>
    <p>பண்பாட்டு வகுப்பு · தமிழ் கீதை பதிவுகள்</p>
    <label for="em">Email</label>
    <input class="in" id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input class="in" id="pw" type="password" autocomplete="current-password" required>
    <button class="pbtn" type="submit">உள்நுழை</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<div id="appView" class="hide">
  <header class="top">
    <img src="images/bcc-logo-160.webp" alt="">
    <b>பதிவுகள் · Admin</b>
    <button class="ibtn" id="refresh" type="button">↻</button>
    <button class="ibtn" id="logout" type="button">வெளியேறு</button>
  </header>
  <main class="main">
    <div class="tabs" role="tablist">
      <button class="tab on" data-src="all" type="button">அனைத்தும்</button>
      <button class="tab" data-src="bcc" type="button">பண்பாட்டு வகுப்பு</button>
      <button class="tab" data-src="tamilgeethai" type="button">தமிழ் கீதை</button>
    </div>
    <div class="stats">
      <div class="stat on" data-st="all"><div class="n" id="c-all">0</div><div class="l">மொத்தம்</div></div>
      <div class="stat" data-st="new"><div class="n" id="c-new">0</div><div class="l">புதியது</div></div>
      <div class="stat" data-st="contacted"><div class="n" id="c-contacted">0</div><div class="l">பேசியாச்சு</div></div>
      <div class="stat" data-st="joined"><div class="n" id="c-joined">0</div><div class="l">சேர்ந்தார்</div></div>
    </div>
    <div class="tools">
      <input class="in" id="q" type="search" placeholder="பெயர் / எண் / ஊர் தேட…">
      <button class="ibtn" id="csv" type="button">⬇ Excel</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty hide" id="empty">பதிவுகள் இல்லை</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://ytwundlllclnevjogunn.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0d3VuZGxsbGNsbmV2am9ndW5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjc3OTMsImV4cCI6MjEwODg0Mzc5M30.AiZq_BM8JjmB6RzdXJXGsyZxoxTFQ5l0u_uEc3E4CRg";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  var STATUS = {new:'புதியது',contacted:'பேசியாச்சு',joined:'சேர்ந்தார்',not_interested:'வேண்டாம்'};
  var SRC = {bcc:'பண்பாட்டு வகுப்பு',tamilgeethai:'தமிழ் கீதை'};
  var LABELS = {gender:'பாலினம்',age:'வயது',std:'படிக்கும் வகுப்பு',school:'பள்ளி',parent:'பெற்றோர்',type:'சேர்க்கை வகை',prev:'முடித்த நிலை',source:'அறிந்தது',notes:'குறிப்பு',
    category:'வகை',role:'பங்கு',level:'பாடல் நிலை',payment:'கட்டணம்',practice:'பயிற்சி',refer:'அறிமுகம்'};
  var rows = [], src = 'all', st = 'all', q = '', shown = 40;
  var $ = function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2200)}
  function fmt(d){try{return new Date(d).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return d}}
  function today(){return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10)}

  async function boot(){
    var s = (await sb.auth.getSession()).data.session;
    if(!s){ show(false); return; }
    var a = await sb.from('admins').select('email').limit(1);
    if(a.error || !a.data.length){ await sb.auth.signOut(); show(false); $('lerr').textContent='இந்த email-க்கு admin அனுமதி இல்லை.'; return; }
    show(true); load();
  }
  function show(app){ $('loginView').classList.toggle('hide',app); $('appView').classList.toggle('hide',!app); }

  $('loginForm').addEventListener('submit', async function(e){
    e.preventDefault(); var b=this.querySelector('button'); b.disabled=true; $('lerr').textContent='';
    var r = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
    b.disabled=false;
    if(r.error){ $('lerr').textContent='Email அல்லது password தவறு.'; return; }
    $('pw').value=''; boot();
  });
  $('logout').onclick = async function(){ await sb.auth.signOut(); rows=[]; show(false); };
  $('refresh').onclick = function(){ load(); };

  async function load(){
    var all=[], from=0, size=1000;
    while(true){
      var r = await sb.from('registrations').select('*').order('created_at',{ascending:false}).range(from, from+size-1);
      if(r.error){ toast('தரவு ஏற்றுவதில் பிழை'); console.error(r.error); return; }
      all = all.concat(r.data); if(r.data.length<size) break; from+=size;
    }
    rows = all; render();
  }

  function filtered(base){
    return rows.filter(function(r){
      if(src!=='all' && r.source!==src) return false;
      if(!base && st!=='all' && r.status!==st) return false;
      if(q){ var h=(r.name+' '+r.whatsapp+' '+(r.district||'')+' '+(r.town||'')+' '+JSON.stringify(r.details||{})).toLowerCase(); if(h.indexOf(q)<0) return false; }
      return true;
    });
  }

  function render(){
    var base = filtered(true);
    $('c-all').textContent = base.length;
    ['new','contacted','joined'].forEach(function(k){ $('c-'+k).textContent = base.filter(function(r){return r.status===k}).length; });
    var list = filtered(false), el = $('list');
    $('empty').classList.toggle('hide', list.length>0);
    el.innerHTML = list.slice(0,shown).map(card).join('') + (list.length>shown?'<button class="act more more-btn" id="loadMore" type="button" style="grid-column:1/-1">மேலும் '+(list.length-shown)+' பதிவுகள்</button>':'');
    var lm=$('loadMore'); if(lm) lm.onclick=function(){shown+=40;render()};
  }

  function card(r){
    var d = r.details||{}, wa = '91'+r.whatsapp;
    var msg = r.source==='bcc' ? 'வணக்கம்! பாரதிய பண்பாட்டு வகுப்பில் பதிவு செய்ததற்கு நன்றி. ' : 'வணக்கம்! தமிழ் கீதை வகுப்பில் பதிவு செய்ததற்கு நன்றி. ';
    var kv = Object.keys(d).filter(function(k){return d[k]!==''&&d[k]!=null&&k!=='timestamp'&&k!=='submittedAt'&&k!=='hasScreenshot'}).map(function(k){return '<dt>'+esc(LABELS[k]||k)+'</dt><dd>'+esc(d[k])+'</dd>'}).join('');
    var due = r.followup_date && r.followup_date<=today() && r.status!=='joined' && r.status!=='not_interested';
    return '<article class="card" data-id="'+r.id+'">'+
      '<div class="card-h"><div class="who"><div class="nm">'+esc(r.name)+'</div>'+
      '<div class="meta">'+esc(r.whatsapp)+' · '+esc([r.town,r.district].filter(Boolean).join(', '))+'</div>'+
      '<div class="meta">'+fmt(r.created_at)+(r.followup_date?' · <span class="'+(due?'due':'')+'">அழைக்க: '+esc(r.followup_date)+'</span>':'')+'</div></div>'+
      '<div style="text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="src '+r.source+'">'+SRC[r.source]+'</span><span class="st st-'+r.status+'">'+STATUS[r.status]+'</span></div></div>'+
      (r.followup_note?'<div class="meta" style="margin-top:8px;color:var(--ink)">📝 '+esc(r.followup_note)+'</div>':'')+
      '<div class="acts"><a class="act wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">WhatsApp</a>'+
      '<a class="act call" href="tel:+'+wa+'">📞 அழைக்க</a>'+
      '<button class="act more" type="button" data-open="'+r.id+'">விவரம் / Follow-up</button></div>'+
      '<div class="det hide" id="det-'+r.id+'"><dl class="kv">'+kv+'</dl>'+
      (r.screenshot_path?'<a class="shot" href="#" data-shot="'+esc(r.screenshot_path)+'">🧾 கட்டண screenshot பார்க்க</a>':'')+
      '<div class="fu"><div><label>நிலை</label><select data-f="status">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(k===r.status?' selected':'')+'>'+STATUS[k]+'</option>'}).join('')+'</select></div>'+
      '<div><label>மீண்டும் அழைக்க</label><input type="date" data-f="followup_date" value="'+esc(r.followup_date||'')+'"></div>'+
      '<div class="full"><label>குறிப்பு</label><textarea data-f="followup_note">'+esc(r.followup_note||'')+'</textarea></div>'+
      '<button class="save full" type="button" data-save="'+r.id+'">சேமி</button></div></div></article>';
  }

  $('list').addEventListener('click', async function(e){
    var o=e.target.closest('[data-open]'); if(o){ $('det-'+o.dataset.open).classList.toggle('hide'); return; }
    var sh=e.target.closest('[data-shot]'); if(sh){ e.preventDefault(); var w=window.open('','_blank'); var r=await sb.storage.from('payments').createSignedUrl(sh.dataset.shot,600); if(r.error){ if(w)w.close(); toast('Screenshot திறக்க முடியவில்லை'); return;} if(w) w.location=r.data.signedUrl; else location.href=r.data.signedUrl; return; }
    var sv=e.target.closest('[data-save]'); if(sv){
      var id=+sv.dataset.save, box=$('det-'+id), patch={updated_at:new Date().toISOString()};
      box.querySelectorAll('[data-f]').forEach(function(f){ patch[f.dataset.f] = f.value===''?null:f.value; });
      if(!patch.status) patch.status='new';
      sv.disabled=true; var r=await sb.from('registrations').update(patch).eq('id',id).select().single(); sv.disabled=false;
      if(r.error){ toast('சேமிக்க முடியவில்லை'); return; }
      rows = rows.map(function(x){return x.id===id?r.data:x}); toast('சேமிக்கப்பட்டது ✓'); render();
    }
  });

  document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){ document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')}); t.classList.add('on'); src=t.dataset.src; shown=40; render(); }; });
  document.querySelectorAll('.stat').forEach(function(t){ t.onclick=function(){ document.querySelectorAll('.stat').forEach(function(x){x.classList.remove('on')}); t.classList.add('on'); st=t.dataset.st; shown=40; render(); }; });
  $('q').addEventListener('input', function(){ q=this.value.trim().toLowerCase(); shown=40; render(); });

  $('csv').onclick = function(){
    var list = filtered(false); if(!list.length){ toast('பதிவுகள் இல்லை'); return; }
    var keys = {}; list.forEach(function(r){ Object.keys(r.details||{}).forEach(function(k){keys[k]=1}); });
    var dk = Object.keys(keys).filter(function(k){return k!=='timestamp'&&k!=='submittedAt'});
    var head = ['தேதி','பிரிவு','பெயர்','WhatsApp','ஊர்','மாவட்டம்'].concat(dk.map(function(k){return LABELS[k]||k})).concat(['நிலை','மீண்டும் அழைக்க','குறிப்பு']);
    var cell = function(v){ v=String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; };
    var lines = [head.map(cell).join(',')].concat(list.map(function(r){ var d=r.details||{}; return [fmt(r.created_at),SRC[r.source],r.name,r.whatsapp,r.town,r.district].concat(dk.map(function(k){return d[k]})).concat([STATUS[r.status],r.followup_date,r.followup_note]).map(cell).join(','); }));
    var blob = new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='registrations-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  };

  boot();
})();
</script>
</body>
</html>
